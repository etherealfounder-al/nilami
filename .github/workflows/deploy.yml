# Tests every push, and deploys main.
#
# One image now holds the whole site — the Go API, the pages it renders and
# the admin app embedded in the binary — so there is one deployment rather
# than two that could disagree about which half was live. That split is what
# broke the panel on 1 November: the API went out, the frontend build failed
# silently, and a success was reported because the deploy only confirmed that
# a webhook had been accepted.
#
# Secrets:
#   COOLIFY_TOKEN  Coolify API token with only the read + deploy abilities

name: CI / Deploy

on:
  push:
  pull_request:

concurrency:
  # One deploy of main at a time, never cancelled half-way; other branches
  # only run checks, so a newer push may cancel an older one.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  COOLIFY_URL: https://coolify.ujjwolkayastha.com.np
  COOLIFY_APP_UUID: wsnpyyxf9dbsloac0g5opp8d
  # The site's own hostname, which is what the post-deploy check requests. It
  # was nilami.ujjwolkayastha.com.np until that domain was detached from the
  # service on 2026-11-01; the deploy kept working and only the verification
  # failed, which is the right way round but easy to misread as a bad deploy.
  SITE_URL: https://nilami.sahayatri.app

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nilami
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d nilami"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: go test (against a real Postgres, so the tenant isolation tests run)
        run: go test ./... -count=1 -p 1
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/nilami?sslmode=disable

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # The action reads packageManager from the repository root by
          # default, and the pin lives with the app it pins.
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # --ignore-scripts because nothing here needs one to build: esbuild is
      # the only package that asks, and its postinstall fetches a binary it
      # also ships as an optional dependency.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm build

  image:
    # Built on every push, not only on main: a Dockerfile that fails is worth
    # knowing about on the branch, which is the lesson of a deploy that only
    # failed once it reached production.
    #
    # Published here too, because the VPS no longer builds. It has two cores
    # and also runs Coolify, Traefik, Postgres and three other applications,
    # and compiling there cost about a minute of both cores per deploy. A push
    # to main moves :latest, which is what deploy/Dockerfile.image resolves;
    # a branch publishes only its own commit, so a pull can be proven from the
    # server before production is the thing depending on it.
    needs: [api, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Which tags this push publishes
        id: tags
        env:
          MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          {
            echo 'list<<TAGS'
            echo "ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA"
            if [ "$MAIN" = true ]; then
              echo "ghcr.io/$GITHUB_REPOSITORY:latest"
            fi
            echo TAGS
          } >> "$GITHUB_OUTPUT"
      - name: Build the image, for the architecture the server runs
        uses: docker/build-push-action@v6
        with:
          context: .
          # The VPS is arm64. Each stage runs on the runner's own
          # architecture and Go cross-compiles, so this needs no emulation.
          platforms: linux/arm64
          # A pull request has nothing to publish and no token to publish
          # with: there it is the build itself that is being checked.
          push: ${{ github.event_name == 'push' }}
          # Provenance would make the tag a manifest index, which is not what
          # the bare FROM in deploy/Dockerfile.image expects to resolve.
          provenance: false
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [api, web, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Wait while another application is deploying
        # The other apps on this server still build on it. Queueing behind a
        # running build keeps this deploy from competing for the two cores,
        # and keeps the site responsive while someone else's image compiles.
        env:
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            busy=$(curl -fsS -H "Authorization: Bearer $TOKEN" "$COOLIFY_URL/api/v1/deployments" | jq 'length')
            [ "$busy" = 0 ] && exit 0
            echo "a deployment is in progress; waiting ($i)"
            sleep 10
          done
          echo "::error::Coolify was still busy after 10 minutes"; exit 1

      - name: Deploy on Coolify and wait for it
        env:
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $TOKEN")
          # force=true: otherwise Coolify reuses the image it already holds
          # for this commit, and the point of the deploy is to pull a new one.
          # The "build" is a single FROM, so forcing it costs a pull.
          deployment=$(curl -fsS -X POST "${auth[@]}" "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=true" \
            | jq -r '.deployments[0].deployment_uuid')
          echo "Coolify deployment $deployment"
          for i in $(seq 1 120); do
            status=$(curl -fsS "${auth[@]}" "$COOLIFY_URL/api/v1/deployments/$deployment" | jq -r .status)
            echo "status: $status"
            case "$status" in
              finished) break ;;
              failed|cancelled*) echo "::error::Coolify deployment $status"; exit 1 ;;
            esac
            sleep 10
          done
          [ "$status" = finished ] || { echo "::error::timed out waiting for Coolify"; exit 1; }

      - name: The site is healthy
        run: |
          for i in $(seq 1 30); do
            curl -fsS "$SITE_URL/healthz" && exit 0
            sleep 5
          done
          echo "::error::$SITE_URL/healthz did not come up"; exit 1

      - name: The pages and the panel are served, not just the API
        run: |
          # /healthz answers before the embedded frontend is reachable, so it
          # alone cannot tell a working deploy from a binary built without one.
          fail=0
          for path in / /auctions /how-it-works /admin; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL$path")
            echo "$path -> $code"
            [ "$code" = 200 ] || fail=1
          done
          [ "$fail" = 0 ] || { echo "::error::the deploy is serving the API but not the site"; exit 1; }
