# Tests every push, and deploys main.
#
# One image now holds the whole site — the Go API, the pages it renders and
# the admin app embedded in the binary — so there is one deployment rather
# than two that could disagree about which half was live. That split is what
# broke the panel on 1 November: the API went out, the frontend build failed
# silently, and a success was reported because the deploy only confirmed that
# a webhook had been accepted.
#
# Secrets:
#   COOLIFY_TOKEN  Coolify API token with only the read + deploy abilities

name: CI / Deploy

on:
  push:
  pull_request:

concurrency:
  # One deploy of main at a time, never cancelled half-way; other branches
  # only run checks, so a newer push may cancel an older one.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  COOLIFY_URL: https://coolify.ujjwolkayastha.com.np
  COOLIFY_APP_UUID: wsnpyyxf9dbsloac0g5opp8d
  SITE_URL: https://nilami.ujjwolkayastha.com.np

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nilami
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d nilami"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: go test (against a real Postgres, so the tenant isolation tests run)
        run: go test ./... -count=1 -p 1
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/nilami?sslmode=disable

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # The action reads packageManager from the repository root by
          # default, and the pin lives with the app it pins.
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # --ignore-workspace because the repository root is a pnpm workspace
      # that does not list this directory, and --ignore-scripts because
      # nothing here needs a dependency's install script to build.
      - run: pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm build

  image:
    # Built on every push, not only on main: a Dockerfile that fails is worth
    # knowing about on the branch, which is the lesson of a deploy that only
    # failed once it reached production.
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [api, web, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy on Coolify and wait for it
        env:
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $TOKEN")
          deployment=$(curl -fsS -X POST "${auth[@]}" "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=false" \
            | jq -r '.deployments[0].deployment_uuid')
          echo "Coolify deployment $deployment"
          for i in $(seq 1 120); do
            status=$(curl -fsS "${auth[@]}" "$COOLIFY_URL/api/v1/deployments/$deployment" | jq -r .status)
            echo "status: $status"
            case "$status" in
              finished) break ;;
              failed|cancelled*) echo "::error::Coolify deployment $status"; exit 1 ;;
            esac
            sleep 10
          done
          [ "$status" = finished ] || { echo "::error::timed out waiting for Coolify"; exit 1; }

      - name: The site is healthy
        run: |
          for i in $(seq 1 30); do
            curl -fsS "$SITE_URL/healthz" && exit 0
            sleep 5
          done
          echo "::error::$SITE_URL/healthz did not come up"; exit 1

      - name: The pages and the panel are served, not just the API
        run: |
          # /healthz answers before the embedded frontend is reachable, so it
          # alone cannot tell a working deploy from a binary built without one.
          fail=0
          for path in / /auctions /how-it-works /admin; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL$path")
            echo "$path -> $code"
            [ "$code" = 200 ] || fail=1
          done
          [ "$fail" = 0 ] || { echo "::error::the deploy is serving the API but not the site"; exit 1; }
