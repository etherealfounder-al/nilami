{{define "head"}}<meta property="og:type" content="website">{{end}}

{{define "content"}}
<main class="mx-auto max-w-6xl px-5 pb-24">
  <div class="max-w-2xl py-14">
    <p class="text-xs font-semibold uppercase tracking-[0.2em] text-brass-600">{{.S "how.kicker"}}</p>
    <h1 class="font-display mt-2 text-4xl font-semibold tracking-tight text-evergreen-900 sm:text-5xl">{{.S "how.title"}}</h1>
    <p class="mt-4 text-lg leading-relaxed text-ink-soft">{{.S "how.sub"}}</p>
  </div>

  <ol class="relative max-w-3xl space-y-0 border-l border-ink/12 pl-10">
    {{range $i, $s := .Items "how.steps"}}
    <li class="relative pb-12">
      <span class="absolute -left-[3.35rem] grid size-10 place-items-center rounded-full border border-brass-500/50 bg-ivory font-display text-sm font-semibold text-brass-600">{{add $i 1}}</span>
      <h2 class="font-display text-2xl font-semibold text-evergreen-900">{{index $s "title"}}</h2>
      <p class="mt-2 leading-relaxed text-ink-soft">{{index $s "body"}}</p>
    </li>
    {{end}}
  </ol>
</main>
{{end}}
